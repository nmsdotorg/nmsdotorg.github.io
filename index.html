<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zulu Time</title>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f5f0;
      --text: #1a1917;
      --sub: #7a7672;
      --transition-duration: 2s;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      transition:
        background-color var(--transition-duration) ease,
        color var(--transition-duration) ease;
      overflow: hidden;
    }

    body.day {
      --bg: #f7f5f0;
      --text: #1a1917;
      --sub: #7a7672;
    }

    /* Kept for future use */
    body.night {
      --bg: #0f0e0d;
      --text: #e8e4dc;
      --sub: #5a5652;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .clock-wrap {
      position: absolute;
      top: 40%;
      left: 30%;
      transform: translate(-50%, -50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.08em;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.3s;
    }

    .time-row {
      display: flex;
      align-items: flex-end;
      gap: 0.3em;
    }

    .time {
      font-size: clamp(3.5rem, 8vw, 7rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      color: var(--text);
      transition: color var(--transition-duration) ease;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: clamp(1.1rem, 2.5vw, 2rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--sub);
      transition: color var(--transition-duration) ease;
      padding-left: 0.1em;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Seconds bar */
    .seconds-bar-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      z-index: 10;
      background: transparent;
    }

    .seconds-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #4CB7E1;
      transition: background-color var(--transition-duration) ease;
    }

    /* Menu */
    .menu-wrap {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0.2;
      transition: opacity 0.4s ease;
    }

    .menu-btn:hover,
    .menu-btn:focus-visible,
    .menu-btn[aria-expanded="true"] {
      opacity: 0.7;
      outline: none;
    }

    .menu-btn span {
      display: block;
      width: 20px;
      height: 1px;
      background-color: var(--text);
    }

    .menu {
      list-style: none;
      margin-top: 0.4rem;
      min-width: 5.5rem;
      text-align: right;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.4s ease;
    }

    .menu.open {
      max-height: 20rem;
      opacity: 1;
    }

    .menu button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--sub);
      padding: 0.3rem 0.5rem;
      transition: color 0.3s ease;
    }

    .menu button:hover,
    .menu button.active {
      color: var(--text);
    }

    .menu button.active {
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="menu-wrap">
    <button class="menu-btn" id="menu-btn" aria-label="Time zones" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="menu" id="menu">
      <li><button data-tz="UTC" data-code="" class="active">z</button></li>
      <li><button data-tz="Europe/Paris" data-code="fr">fr</button></li>
      <li><button data-tz="America/New_York" data-code="nyc">nyc</button></li>
      <li><button data-tz="America/Bogota" data-code="co">co</button></li>
      <li><button id="local-btn" data-tz="UTC" data-code="local">local</button></li>
    </ul>
  </div>

  <div class="clock-wrap">
    <div class="time-row">
      <div class="time" id="zulu-time">--:--</div>
    </div>

    <div class="date" id="zulu-date">--</div>
  </div>

  <div class="seconds-bar-track">
    <div class="seconds-bar-fill" id="seconds-bar"></div>
  </div>

  <script>
    const MONTHS = [
      'Jan','Feb','Mar','Apr','May','Jun',
      'Jul','Aug','Sep','Oct','Nov','Dec'
    ];

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function formatDate(d) {
      const day = pad(d.getUTCDate());
      const mon = MONTHS[d.getUTCMonth()];
      const yr  = String(d.getUTCFullYear()).slice(-2);
      return `${day}${mon}${yr}`;
    }

    let tz = 'UTC';  // IANA timezone; always starts at Zulu
    let code = '';   // label shown for the selected zone

    function label(now) {
      if (!code) return '';
      const off = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' })
        .formatToParts(now)
        .find(p => p.type === 'timeZoneName').value
        .replace(/^(GMT|UTC)/, '');
      return ` \u00b7 ${code} ${off}`;
    }

    function zoneParts(date, timeZone) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone,
        hourCycle: 'h23',
        year: '2-digit', month: 'numeric', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).formatToParts(date);
      const o = {};
      parts.forEach(p => { o[p.type] = p.value; });
      return o;
    }

    function tick() {
      const now = new Date();
      const z = zoneParts(now, tz);
      const hm = `${z.hour}:${z.minute}`;

      document.title = code ? `${hm} ${code} ${offsetOf(tz, now)}` : `${hm} z`;
      document.getElementById('zulu-time').textContent = hm;
      document.getElementById('zulu-date').textContent =
        `${z.day}${MONTHS[parseInt(z.month, 10) - 1]}${z.year}` + label(now);

      const s = now.getUTCSeconds();
      document.getElementById('seconds-bar').style.width = `${(s / 59) * 100}%`;
    }

    // Menu
    const menuBtn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');

    function offsetOf(zone, date) {
      return new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'shortOffset' })
        .formatToParts(date)
        .find(p => p.type === 'timeZoneName').value
        .replace(/^(GMT|UTC)/, '') || '+0';
    }

    function updateMenuLabels() {
      const now = new Date();
      menu.querySelectorAll('button[data-tz]').forEach(b => {
        const c = b.dataset.code;
        if (c) b.textContent = `${c} ${offsetOf(b.dataset.tz, now)}`;
      });
    }

    function setMenu(open) {
      menu.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
    }

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setMenu(!menu.classList.contains('open'));
    });

    menu.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tz]');
      if (!btn) return;
      tz = btn.dataset.tz;
      code = btn.dataset.code || '';
      menu.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      tick();
      setMenu(false);
    });

    document.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

    document.getElementById('local-btn').dataset.tz =
  Intl.DateTimeFormat().resolvedOptions().timeZone;

    updateMenuLabels();
    setInterval(updateMenuLabels, 60000);

    tick();
    setInterval(tick, 1000);

    // Force permanent day mode
    document.body.classList.add('day');
  </script>

</body>
</html>
